    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Health Risk Monitor (HRM)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "HRM is HCRM's predictive analytics platform. It ingests medical and pharmacy claims, normalizes them to 95%+ accuracy, and forecasts healthcare spending at member and group level twelve months forward, so cost can be managed before it is incurred."
          }
        },
        {
          "@type": "Question",
          "name": "How is 95%+ normalization accuracy measured?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is measured across client datasets after ingestion. The engine standardizes provider names, reconciles procedure and diagnosis code sets, maps pharmacy NDC identifiers to GPI, removes duplicates and validates each claim against clinical logic rules. Claims it cannot resolve are surfaced as exceptions rather than passed silently into the model."
          }
        },
        {
          "@type": "Question",
          "name": "How does the HCRM demo work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A 45-minute demo runs 24 months of de-identified claims through the live HRM interface. It is followed by a one-month free trial on your own medical and pharmacy claims, with no obligation."
          }
        },
        {
          "@type": "Question",
          "name": "How is this different from the reporting a TPA already provides?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TPA reporting records what has already been paid. HRM projects the next twelve months at member and group level and expresses that projection in dollars, which is the difference between knowing your trend and having time to change it."
          }
        },
        {
          "@type": "Question",
          "name": "Who does HCRM serve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Self-funded employers, benefits consultants, insurance companies, stop-loss carriers and captives, population health management teams, clinics and healthcare providers, employer clinics, health plans, third-party administrators, accountable care organizations, and health management vendors."
          }
        }
      ]
    }
